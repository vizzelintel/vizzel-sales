services:
  postgres:
    image: postgres:16-alpine
    container_name: vizzel-sales-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: vizzel
      POSTGRES_PASSWORD: vizzel_dev
      POSTGRES_DB: vizzel_sales
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vizzel_sales_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizzel -d vizzel_sales"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: vizzel-sales-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://vizzel:vizzel_dev@postgres:5432/vizzel_sales?sslmode=disable
      FILE_STORAGE_DRIVER: local
      FILE_STORAGE_PATH: /data/docs
      JWT_SECRET: dev-jwt-secret-change-me
      LINE_CHANNEL_SECRET: dev-line-secret
      PORT: "8080"
      GIN_MODE: debug
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
    volumes:
      - vizzel_sales_docs_dev:/data/docs

volumes:
  vizzel_sales_pg_dev:
  vizzel_sales_docs_dev:
