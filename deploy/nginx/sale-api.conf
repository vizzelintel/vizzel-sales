# sale-api.vizzeltrack.com → sales-api:8080
upstream sales_api_prod {
    server sales-api:8080;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name sale-api.vizzeltrack.com;

    ssl_certificate     /etc/nginx/certs/apps.vizzeltrack.com.pem;
    ssl_certificate_key /etc/nginx/certs/apps.vizzeltrack.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://sales_api_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
