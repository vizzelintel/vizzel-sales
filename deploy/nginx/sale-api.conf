# sale-api.vizzeltrack.com → sales-api:8080 (prod stack; nginx starts even if container absent)
server {
    listen 443 ssl http2;
    server_name sale-api.vizzeltrack.com;

    ssl_certificate     /etc/nginx/certs/apps.vizzeltrack.com.pem;
    ssl_certificate_key /etc/nginx/certs/apps.vizzeltrack.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;
    proxy_read_timeout 120s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://sales-api:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
