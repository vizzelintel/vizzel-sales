# sale.vizzeltrack.com → static frontend (prod)
# Mount host /opt/vizzel-sales-frontend into nginx-proxy (read-only).

server {
    listen 443 ssl http2;
    server_name sale.vizzeltrack.com;

    ssl_certificate     /etc/nginx/certs/apps.vizzeltrack.com.pem;
    ssl_certificate_key /etc/nginx/certs/apps.vizzeltrack.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /opt/vizzel-sales-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
