name: deploy-prod

on:
  push:
    tags:
      - "sale-v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.SALES_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SALES_PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync repo and rebuild production stack
        env:
          DEPLOY_HOST: ${{ secrets.SALES_PROD_HOST }}
          DEPLOY_USER: ${{ secrets.SALES_DEPLOY_USER }}
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd /opt/vizzel-sales
          git fetch origin --tags
          git checkout "${DEPLOY_TAG}"
          bash scripts/migrate.sh
          docker compose -f deploy/docker-compose.prod.yml up -d --build
          docker compose -f deploy/docker-compose.prod.yml ps
          REMOTE
