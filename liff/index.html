<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Vizzel Sales</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f2f7; color: #1c1c1e; -webkit-tap-highlight-color: transparent; }

    /* ── Splash ── */
    #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; text-align: center; }
    .splash-icon  { font-size: 60px; margin-bottom: 18px; }
    .splash-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .splash-sub   { color: #8e8e93; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    .splash-spinner { width: 32px; height: 32px; border: 3px solid #e5e5ea; border-top-color: #06C755; border-radius: 50%; animation: spin 0.7s linear infinite; }
    .splash-err   { color: #FF3B30; font-size: 13px; margin-top: 14px; line-height: 1.4; }

    /* ── App ── */
    #app { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
    .hdr { background: #06C755; color: white; padding: 11px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .hdr img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.25); }
    .hdr-info h1 { font-size: 15px; font-weight: 600; }
    .hdr-info p  { font-size: 11px; opacity: .85; }

    /* ── Tabs ── */
    .tabs { background: white; display: flex; border-bottom: 1px solid #e5e5ea; flex-shrink: 0; }
    .tab  { flex: 1; padding: 9px 2px; text-align: center; font-size: 12px; color: #8e8e93; border: none; background: none; cursor: pointer; font-weight: 500; font-family: inherit; position: relative; }
    .tab.on { color: #06C755; font-weight: 600; }
    .tab.on::after { content: ''; position: absolute; bottom: 0; left: 15%; right: 15%; height: 2px; background: #06C755; border-radius: 2px 2px 0 0; }

    /* ── Content ── */
    .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; }
    .screen { display: none; }
    .screen.on { display: block; }

    /* ── Pipeline grid ── */
    .pipe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
    .pipe-card { background: white; border-radius: 10px; padding: 10px 6px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.07); border-top: 3px solid; cursor: pointer; transition: transform .12s; }
    .pipe-card:active { transform: scale(.96); }
    .pipe-card .cnt  { font-size: 26px; font-weight: 700; line-height: 1; }
    .pipe-card .lbl  { font-size: 10px; color: #8e8e93; margin-top: 4px; line-height: 1.2; }
    /* color groups */
    .cg-gray   { border-color: #8e8e93; } .cg-gray   .cnt { color: #8e8e93; }
    .cg-blue   { border-color: #007AFF; } .cg-blue   .cnt { color: #007AFF; }
    .cg-orange { border-color: #FF9500; } .cg-orange .cnt { color: #FF9500; }
    .cg-green  { border-color: #34C759; } .cg-green  .cnt { color: #34C759; }
    .cg-red    { border-color: #FF3B30; } .cg-red    .cnt { color: #FF3B30; }

    /* ── Section title ── */
    .sec { font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }

    /* ── Project list ── */
    .plist { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
    .prow  { padding: 12px 14px; border-bottom: 1px solid #f2f2f7; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .1s; }
    .prow:last-child { border-bottom: none; }
    .prow:active { background: #f5f5f5; }
    .prow-info { flex: 1; min-width: 0; }
    .prow-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prow-sub  { font-size: 12px; color: #8e8e93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chev { color: #c7c7cc; font-size: 16px; flex-shrink: 0; }

    /* ── Badges ── */
    .bdg { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .bg-gray   { background: #e5e5ea; color: #636366; }
    .bg-blue   { background: #dff0ff; color: #007AFF; }
    .bg-orange { background: #fff3e0; color: #FF9500; }
    .bg-green  { background: #e4f9ec; color: #34C759; }
    .bg-red    { background: #ffe5e5; color: #FF3B30; }

    /* ── Form ── */
    .fcard { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
    .frow  { display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid #f2f2f7; }
    .frow:last-child { border-bottom: none; }
    .flbl  { font-size: 13px; color: #8e8e93; width: 80px; flex-shrink: 0; padding: 13px 0; }
    .finp  { flex: 1; border: none; outline: none; font-size: 15px; padding: 13px 0 13px 8px; color: #1c1c1e; background: transparent; width: 100%; font-family: inherit; }
    .finp::placeholder { color: #c7c7cc; }
    select.finp { appearance: none; -webkit-appearance: none; }

    /* ── Province searchable dropdown ── */
    #province-drop { position: fixed; background: white; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-height: 248px; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 600; display: none; }
    #province-drop.open { display: block; }
    .pdrop-item { padding: 13px 16px; font-size: 15px; cursor: pointer; border-bottom: 1px solid #f2f2f7; color: #1c1c1e; }
    .pdrop-item:last-child { border-bottom: none; }
    .pdrop-item:active { background: #f5f5f5; }
    .pdrop-item mark { background: #fef3c7; color: #1c1c1e; font-weight: 700; padding: 0 1px; border-radius: 2px; font-style: normal; }
    .pdrop-empty { padding: 16px; font-size: 14px; color: #8e8e93; text-align: center; }

    /* ── Detail ── */
    .dcard { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
    .drow  { display: flex; padding: 12px 14px; border-bottom: 1px solid #f2f2f7; }
    .drow:last-child { border-bottom: none; }
    .dkey  { font-size: 13px; color: #8e8e93; width: 100px; flex-shrink: 0; }
    .dval  { flex: 1; font-size: 14px; word-break: break-word; }
    .dval a { color: #007AFF; text-decoration: none; }

    /* ── Document list ── */
    .doc-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f2f2f7; gap: 10px; }
    .doc-row:last-child { border-bottom: none; }
    .doc-icon { font-size: 22px; flex-shrink: 0; }
    .doc-info { flex: 1; min-width: 0; }
    .doc-type { font-size: 13px; font-weight: 600; }
    .doc-date { font-size: 11px; color: #8e8e93; margin-top: 2px; }
    .doc-link { color: #007AFF; font-size: 12px; flex-shrink: 0; }

    /* ── Status buttons ── */
    .sbtn-grid { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    .sbtn-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .sbtn { padding: 9px 14px; border-radius: 20px; border: 2px solid; background: white; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
    .sbtn:active { opacity: .75; }
    .sbtn.cg-gray   { border-color: #8e8e93; color: #8e8e93; }
    .sbtn.cg-blue   { border-color: #007AFF; color: #007AFF; }
    .sbtn.cg-orange { border-color: #FF9500; color: #FF9500; }
    .sbtn.cg-green  { border-color: #34C759; color: #34C759; }
    .sbtn.cg-red    { border-color: #FF3B30; color: #FF3B30; }
    .sbtn-blocked { opacity: .4; cursor: not-allowed; }
    .sbtn-hint { font-size: 10px; color: #FF9500; text-align: center; max-width: 100px; line-height: 1.3; }

    /* ── Doc sequential progress ── */
    .doc-progress { display: flex; align-items: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 12px 10px 10px; gap: 0; }
    .dp-item { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; flex-shrink: 0; }
    .dp-icon { font-size: 18px; line-height: 1; }
    .dp-label { font-size: 9px; text-align: center; color: #8e8e93; line-height: 1.2; max-width: 56px; }
    .dp-item.dp-done .dp-label { color: #34C759; font-weight: 700; }
    .dp-item.dp-next .dp-label { color: #FF9500; font-weight: 700; }
    .dp-item.dp-locked .dp-icon { filter: grayscale(1); opacity: .4; }
    .dp-arrow { color: #c7c7cc; font-size: 12px; align-self: center; margin-bottom: 20px; padding: 0 1px; flex-shrink: 0; }
    .doc-other-badge { font-size: 12px; color: #8e8e93; text-align: right; padding: 6px 14px 4px; }

    /* ── Buttons ── */
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; font-family: inherit; transition: opacity .15s; }
    .btn:active { opacity: .8; }
    .btn-green { background: #06C755; color: white; }
    .back-btn  { display: inline-flex; align-items: center; gap: 4px; color: #06C755; background: none; border: none; font-size: 15px; cursor: pointer; padding: 0; margin-bottom: 12px; font-weight: 500; font-family: inherit; }

    /* ── Overlay ── */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: flex-end; }
    #overlay.on { display: flex; }
    .ov-box { background: white; border-radius: 20px 20px 0 0; width: 100%; padding: 20px 18px 32px; }
    .ov-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .ov-sub   { font-size: 13px; color: #8e8e93; margin-bottom: 16px; line-height: 1.4; }
    .ov-section { margin-bottom: 12px; }
    .ov-label { font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
    .ov-input { width: 100%; border: 1.5px solid #e5e5ea; border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit; outline: none; }
    .ov-input:focus { border-color: #06C755; }
    textarea.ov-input { resize: none; height: 90px; }
    /* File pick: input overlaid on button so LINE WebView can trigger it */
    .file-pick-wrap { position: relative; width: 100%; }
    .file-pick-btn  { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; border: 1.5px dashed #c7c7cc; border-radius: 10px; background: white; font-size: 15px; font-family: inherit; cursor: pointer; color: #636366; }
    .file-pick-btn.has-file { border-color: #06C755; background: #f0fdf4; color: #06C755; }
    .file-pick-inp  { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; } /* font-size:0 hides iOS label */
    .file-pick-name { margin-top: 8px; font-size: 13px; color: #06C755; font-weight: 600; word-break: break-all; }
    .ov-btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .ov-btn     { flex: 1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; border: none; }
    .ov-btn-primary { background: #06C755; color: white; }
    .ov-btn-cancel  { background: #f2f2f7; color: #3c3c43; }

    /* ── Misc ── */
    .spin-wrap { display: flex; justify-content: center; padding: 36px 0; }
    .spinner   { width: 28px; height: 28px; border: 3px solid #e5e5ea; border-top-color: #06C755; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 36px 20px; color: #8e8e93; }
    .empty-icon { font-size: 36px; margin-bottom: 8px; }
    .empty-text { font-size: 14px; }
    .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: rgba(28,28,30,.9); color: white; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 200; white-space: nowrap; }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>

<!-- ── Splash ── -->
<div id="splash">
  <div class="splash-icon">📊</div>
  <h2 class="splash-title">Vizzel Sales</h2>
  <p class="splash-sub">ระบบจัดการลูกค้า<br>หน่วยงานราชการ</p>
  <div class="splash-spinner"></div>
</div>

<!-- ── App ── -->
<div id="app">
  <div class="hdr">
    <img id="uPic" src="" alt="">
    <div class="hdr-info">
      <h1>สวัสดี, <span id="uName">...</span></h1>
      <p>Vizzel Sales CRM</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="pipeline" onclick="showTab('pipeline')">📊 Pipeline</button>
    <button class="tab"    data-tab="projects" onclick="showTab('projects')">📋 โครงการ</button>
    <button class="tab"    data-tab="create"   onclick="showTab('create')">➕ สร้าง</button>
  </div>

  <div class="content">

    <!-- Pipeline -->
    <div class="screen on" id="screen-pipeline">
      <div class="pipe-grid" id="pipeGrid">
        <div class="spin-wrap" style="grid-column:1/-1"><div class="spinner"></div></div>
      </div>
      <div class="sec">โครงการล่าสุด</div>
      <div class="plist" id="pipeRecent"></div>
    </div>

    <!-- Projects list -->
    <div class="screen" id="screen-projects">
      <div class="plist" id="projList"></div>
    </div>

    <!-- Create form -->
    <div class="screen" id="screen-create">
      <div class="sec" style="margin-bottom:10px">ข้อมูลโครงการใหม่</div>
      <div class="fcard">
        <div class="frow">
          <label class="flbl">หน่วยงาน *</label>
          <input class="finp" id="f-agency" placeholder="ชื่อหน่วยงาน / องค์กร">
        </div>
        <div class="frow">
          <label class="flbl">ประเภท</label>
          <select class="finp" id="f-atype">
            <option value="">-- เลือกประเภท --</option>
            <option>กระทรวง</option>
            <option>กรม</option>
            <option>องค์การบริหารส่วนจังหวัด</option>
            <option>องค์การบริหารส่วนตำบล</option>
            <option>เทศบาลนคร</option>
            <option>เทศบาลเมือง</option>
            <option>เทศบาลตำบล</option>
            <option>รัฐวิสาหกิจ</option>
            <option>โรงเรียน</option>
            <option>วิทยาลัย</option>
            <option>มหาวิทยาลัย</option>
            <option>โรงพยาบาลศูนย์</option>
            <option>โรงพยาบาลทั่วไป</option>
            <option>โรงพยาบาลชุมชน</option>
            <option>โรงพยาบาลเอกชน</option>
            <option>บริษัทเอกชน</option>
          </select>
        </div>
        <div class="frow">
          <label class="flbl">จังหวัด</label>
          <input class="finp" id="f-region" placeholder="พิมพ์ชื่อจังหวัด..." autocomplete="new-password"
                 onfocus="showProvinces()" onclick="showProvinces()" oninput="filterProvinces()">
        </div>
        <div class="frow">
          <label class="flbl">ผู้ติดต่อ</label>
          <input class="finp" id="f-contact" placeholder="ชื่อผู้ติดต่อ">
        </div>
        <div class="frow">
          <label class="flbl">ตำแหน่ง</label>
          <input class="finp" id="f-pos" placeholder="ตำแหน่ง / แผนก">
        </div>
        <div class="frow">
          <label class="flbl">โทรศัพท์ *</label>
          <input class="finp" id="f-phone" type="tel" placeholder="เบอร์โทรศัพท์">
        </div>
      </div>
      <button class="btn btn-green" onclick="submitCreate()">สร้างโครงการ</button>
    </div>

    <!-- Detail -->
    <div class="screen" id="screen-detail">
      <button class="back-btn" onclick="goBack()">‹ กลับ</button>
      <div id="detailContent"></div>
    </div>

  </div><!-- /content -->
</div><!-- /app -->

<!-- ── Overlay ── -->
<div id="overlay" onclick="ovClickOutside(event)">
  <div class="ov-box" id="ov-box">
    <div class="ov-title" id="ov-title"></div>
    <div class="ov-sub"   id="ov-sub"></div>
    <div id="ov-body"></div>
    <div class="ov-btn-row">
      <button class="ov-btn ov-btn-cancel"  onclick="closeOverlay()">ยกเลิก</button>
      <button class="ov-btn ov-btn-primary" id="ov-confirm" onclick="confirmOverlay()">ยืนยัน</button>
    </div>
  </div>
</div>

<div id="province-drop"></div>
<div class="toast" id="toast"></div>

<script>
const LIFF_ID = "2010133685-tke1EWht";
const API     = "https://vizzel-sales-production.up.railway.app";

let token    = "";
let projects = [];
let curTab   = "pipeline";
let prevTab  = "pipeline";
let detailProjectID = "";

/* ─── Status metadata ─── */
const STATUS = {
  registrator: { label: "Registrator",     short: "Registr.",   group: "gray"   },
  present:     { label: "นัดหมาย Present", short: "Present",    group: "blue"   },
  demo:        { label: "นัดหมาย Demo",    short: "Demo",       group: "blue"   },
  site_survey: { label: "นัดหมาย Site Survey", short: "Site Survey", group: "blue" },
  quotation:   { label: "ส่งใบเสนอราคา",  short: "Quotation",  group: "orange" },
  tor:         { label: "ส่งร่าง TOR",     short: "TOR",        group: "orange" },
  contract:    { label: "แนบสัญญา",        short: "Contract",   group: "orange" },
  won:         { label: "Won",             short: "Won",        group: "green"  },
  closing:     { label: "แนบเอกสารปิดงาน", short: "Closing",    group: "green"  },
  closed:      { label: "ปิดงาน",          short: "Closed",     group: "green"  },
  reject:      { label: "Reject",          short: "Reject",     group: "red"    },
};
const STATUS_KEYS = Object.keys(STATUS);

/* Transitions: which statuses can follow each status */
const NEXT = {
  registrator:  ["present","demo","site_survey","reject"],
  present:      ["demo","site_survey","quotation","reject"],
  demo:         ["site_survey","quotation","reject"],
  site_survey:  ["quotation","reject"],
  quotation:    ["tor","contract","reject"],
  tor:          ["contract","reject"],
  contract:     ["won","reject"],
  won:          ["closing"],
  closing:      ["closed","reject"],
  closed:       [],
  reject:       ["registrator"],
};

/* Sequential doc requirements per status (mirrors backend statusDocRequirements) */
const DOC_REQUIREMENTS = {
  tor:      ["QUOTE"],
  contract: ["QUOTE","TOR"],
  closing:  ["QUOTE","TOR","CONTRACT"],
  closed:   ["QUOTE","TOR","CONTRACT","CLOSING"],
};

const DOC_NAMES = {
  QUOTE:    "ใบเสนอราคา",
  TOR:      "ร่าง TOR",
  CONTRACT: "สัญญาจัดซื้อจัดจ้าง",
  CLOSING:  "เอกสารปิดงาน",
  DELIVERY: "ใบส่งมอบสินทรัพย์",
  OTHER:    "เอกสารอื่นๆ",
};

const DOC_TYPES_SEQ = ["QUOTE","TOR","CONTRACT","CLOSING","DELIVERY"];

/* Statuses that trigger a Google Calendar appointment */
const APPT_STATUSES = new Set(["present","demo","site_survey"]);

/* ─── Init ─── */
async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ scope: "profile openid email" }); return; }
    await loginWithLine();
  } catch(e) {
    const el = document.createElement("p");
    el.className = "splash-err";
    el.textContent = "เกิดข้อผิดพลาด: " + e.message;
    document.getElementById("splash").appendChild(el);
  }
}

async function loginWithLine() {
  const accessToken = liff.getAccessToken();
  const profile     = await liff.getProfile();
  // Email from OIDC ID token — present only when "email" scope is granted on the LINE channel
  const email = liff.getDecodedIDToken()?.email || "";

  document.getElementById("uName").textContent = profile.displayName;
  document.getElementById("uPic").src          = profile.pictureUrl || "";

  const res = await fetch(API + "/api/v1/auth/line", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: accessToken, email }),
  });
  if (!res.ok) throw new Error("auth failed " + res.status);
  token = (await res.json()).token;

  document.getElementById("splash").style.display = "none";
  document.getElementById("app").style.display    = "flex";
  loadProjects();
}

/* ─── Data ─── */
async function loadProjects() {
  try {
    const res = await fetch(API + "/api/v1/projects", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!res.ok) throw new Error();
    projects = await res.json();
    renderPipeline();
    renderProjList();
  } catch {
    toast("โหลดข้อมูลไม่สำเร็จ");

/* ─── Pipeline ─── */
function renderPipeline() {
  const counts = {};
  STATUS_KEYS.forEach(s => counts[s] = 0);
  projects.forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });

  document.getElementById("pipeGrid").innerHTML = STATUS_KEYS.map(s => {
    const g = STATUS[s].group;
    return `<div class="pipe-card cg-${g}" onclick="filterGo('${s}')">
      <div class="cnt">${counts[s]}</div>
      <div class="lbl">${STATUS[s].short}</div>
    </div>`;
  }).join("");

  const recent = projects.slice(0, 5);
  document.getElementById("pipeRecent").innerHTML =
    recent.length ? recent.map(rowH).join("") : emptyH("📂","ยังไม่มีโครงการ");
}

function filterGo(status) {
  renderProjList(status);
  showTab("projects", false);
}

/* ─── Project list ─── */
function renderProjList(filterStatus) {
  const list = filterStatus ? projects.filter(p => p.status === filterStatus) : projects;
  document.getElementById("projList").innerHTML =
    list.length ? list.map(rowH).join("") : emptyH("📂","ยังไม่มีโครงการ");
}

function rowH(p) {
  const sub = [p.agency_type, p.region].filter(Boolean).join(" · ");
  const g   = STATUS[p.status]?.group || "gray";
  return `<div class="prow" onclick="showDetail('${esc(p.id)}')">
    <div class="prow-info">
      <div class="prow-name">${esc(p.agency_name||'-')}</div>
      ${sub ? `<div class="prow-sub">${esc(sub)}</div>` : ""}
    </div>
    <span class="bdg bg-${g}">${STATUS[p.status]?.short || p.status}</span>
    <span class="chev">›</span>

/* ─── Create ─── */
async function submitCreate() {
  const agency = document.getElementById("f-agency").value.trim();
  const phone  = document.getElementById("f-phone").value.trim();
  if (!agency) { toast("กรุณากรอกชื่อหน่วยงาน"); return; }
  if (!phone)  { toast("กรุณากรอกเบอร์โทรศัพท์"); return; }

  const payload = {
    agency_name:      agency,
    agency_type:      document.getElementById("f-atype").value,
    region:           document.getElementById("f-region").value.trim(),
    contact_person:   document.getElementById("f-contact").value.trim(),
    contact_position: document.getElementById("f-pos").value.trim(),
    contact_phone:    phone,
  };

  try {
    const res = await fetch(API + "/api/v1/projects", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error); }
    const created = await res.json();
    projects.unshift(created);
    ["f-agency","f-region","f-contact","f-pos","f-phone"].forEach(id => {
      document.getElementById(id).value = "";
    });
    document.getElementById("f-atype").value = "";
    toast("สร้างโครงการสำเร็จ ✓");
    renderPipeline();
    renderProjList();
    showTab("pipeline");
  } catch(e) {
    toast("สร้างไม่สำเร็จ: " + (e.message || "error"));
  }
}

/* ─── Detail ─── */
async function showDetail(id) {
  prevTab = curTab;
  detailProjectID = id;
  const p = projects.find(x => x.id === id);
  if (!p) return;

  activateScreen("detail");
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));

  // Render project info immediately; docs + status buttons after we know what's uploaded
  document.getElementById("detailContent").innerHTML =
    buildDetailInfo(p) +

     <div id="docsSection"><div class="spin-wrap"><div class="spinner"></div></div></div>
     <div class="sec" style="margin-bottom:7px">เปลี่ยนสถานะ</div>
     <div id="statusSection"><div class="spin-wrap"><div class="spinner"></div></div></div>`;

  const docs = await fetchProjectDocs(id);
  renderDocsSection(docs, id);

}

function buildDetailInfo(p) {
  const rows = [
    ["หน่วยงาน",   p.agency_name || "-"],
    ["ประเภท",     p.agency_type || "-"],
    ["จังหวัด",    p.region || "-"],
    ["ผู้ติดต่อ",  p.contact_person || "-"],
    ["ตำแหน่ง",    p.contact_position || "-"],
    ["โทรศัพท์",   p.contact_phone
        ? `<a href="tel:${esc(p.contact_phone)}">${esc(p.contact_phone)}</a>` : "-"],
    ["สถานะ",      `<span class="bdg bg-${STATUS[p.status]?.group||'gray'}">${STATUS[p.status]?.label||p.status}</span>`],

    ...(p.status_note   ? [["หมายเหตุ",      esc(p.status_note)]]   : []),

async function fetchProjectDocs(projectID) {
  try {
    const res = await fetch(`${API}/api/v1/projects/${projectID}/documents`, {
      headers: { Authorization: "Bearer " + token },
    });
    return res.ok ? await res.json() : [];
  } catch { return []; }
}

function renderDocsSection(docs, projectID) {
  const el = document.getElementById("docsSection");
  if (!el) return;

  const docTypeSet = new Set(docs.map(d => d.doc_type));

  // Sequential progress bar
  let foundMissing = false;
  const progressItems = DOC_TYPES_SEQ.map((dt, i) => {
    const done = docTypeSet.has(dt);
    let state, icon;
    if (done) { state = "dp-done"; icon = "✅"; }
    else if (!foundMissing) { foundMissing = true; state = "dp-next"; icon = "⏳"; }
    else { state = "dp-locked"; icon = "🔒"; }
    const arrow = i < DOC_TYPES_SEQ.length - 1
      ? `<div class="dp-arrow">›</div>` : "";
    return `<div class="dp-item ${state}">
      <div class="dp-icon">${icon}</div>
      <div class="dp-label">${DOC_NAMES[dt]}</div>
    </div>${arrow}`;
  }).join("");

  // Doc rows (sequential first, OTHER at end)
  const seqDocs   = docs.filter(d => d.doc_type !== "OTHER");
  const otherDocs = docs.filter(d => d.doc_type === "OTHER");
  const allDocs   = [...seqDocs, ...otherDocs];

  const docRows = allDocs.length
    ? allDocs.map(d => `
        <div class="doc-row">
          <div class="doc-icon">${fileIcon(d.file_name)}</div>
          <div class="doc-info">
            <div class="doc-type">${esc(DOC_NAMES[d.doc_type] || d.doc_type || "เอกสาร")}</div>
            <div class="doc-date">${esc(d.file_name || '')}${d.file_name && d.created_at ? ' · ' : ''}${fmtDate(d.created_at)}</div>
          </div>
          <a class="doc-link" href="${esc(d.file_url)}" target="_blank">ดู ›</a>
        </div>`).join("")
    : `<div style="border-top:1px solid #f2f2f7">${emptyH("📎","ยังไม่มีเอกสาร")}</div>`;

  el.innerHTML = `
    <div class="dcard" style="overflow:hidden">
      <div class="doc-progress">${progressItems}</div>
      <div style="border-top:1px solid #f2f2f7">${docRows}</div>
      <div class="doc-other-badge">เอกสารอื่นๆ ${otherDocs.length}/5</div>
    </div>
    <button class="btn btn-green" style="margin-top:8px;font-size:14px"
            onclick="openUploadOverlay('${esc(projectID)}')">+ แนบเอกสาร</button>`;
}

function renderStatusSection(p, docs) {
  const el = document.getElementById("statusSection");
  if (!el) return;

  const nexts = NEXT[p.status] || [];
  if (!nexts.length) {
    el.innerHTML = `<p style="color:#8e8e93;font-size:13px;text-align:center;padding:16px">สิ้นสุดกระบวนการ</p>`;
    return;
  }

  const docTypeSet = new Set(docs.map(d => d.doc_type));
  const btns = nexts.map(s => {
    const g       = STATUS[s]?.group || "gray";
    const missing = (DOC_REQUIREMENTS[s] || []).filter(dt => !docTypeSet.has(dt));
    if (missing.length) {
      return `<div class="sbtn-wrap">
        <button class="sbtn cg-gray sbtn-blocked" disabled>${STATUS[s]?.label || s}</button>
        <span class="sbtn-hint">ต้องการ: ${DOC_NAMES[missing[0]]}</span>
      </div>`;
    }
    return `<button class="sbtn cg-${g}" onclick="tryChangeStatus('${esc(p.id)}','${s}')">${STATUS[s]?.label || s}</button>`;
  }).join("");

  el.innerHTML = `<div class="dcard" style="padding:14px"><div class="sbtn-grid">${btns}</div></div>`;
}

/* ─── Status change ─── */
let _pendingStatus    = "";
let _pendingProjectID = "";

function tryChangeStatus(projectID, newStatus) {
  _pendingStatus    = newStatus;
  _pendingProjectID = projectID;

  if (APPT_STATUSES.has(newStatus)) {
    openApptOverlay(newStatus);
  } else if (newStatus === "reject") {
    openRejectOverlay();
  } else {
    doChangeStatus(projectID, newStatus, "", "");
  }
}

async function doChangeStatus(projectID, status, statusNote, rejectReason, appointmentDate, appointmentNote) {
  try {
    const res = await fetch(`${API}/api/v1/projects/${projectID}/status`, {
      method: "PUT",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({
        status,
        status_note:      statusNote      || "",
        reject_reason:    rejectReason    || "",
        appointment_date: appointmentDate || "",
        appointment_note: appointmentNote || "",
      }),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || "เปลี่ยนสถานะไม่สำเร็จ"); return; }

    const p = projects.find(x => x.id === projectID);
    if (p) {
      p.status            = status;
      p.status_note       = statusNote      || "";
      p.reject_reason     = rejectReason    || "";
      p.appointment_date  = appointmentDate || "";
      p.appointment_note  = appointmentNote || "";
      p.calendar_event_id = data.calendar_event_id || "";
    }

    if (APPT_STATUSES.has(status) && appointmentDate) {
      toast(data.calendar_ok
        ? "✅ บันทึกนัดหมายในปฏิทินแล้ว"
        : "⚠️ เปลี่ยนสถานะแล้ว แต่ไม่สามารถบันทึกปฏิทินได้");
    } else {
      toast("อัปเดตสถานะสำเร็จ ✓");
    }

    renderPipeline();
    renderProjList();
    if (p) {
      // Re-render detail: refresh docs so status buttons reflect updated requirements
      document.getElementById("detailContent").innerHTML =
        buildDetailInfo(p) +
        `<div class="sec" style="margin-bottom:7px">เอกสาร</div>
         <div id="docsSection"><div class="spin-wrap"><div class="spinner"></div></div></div>
         <div class="sec" style="margin-bottom:7px">เปลี่ยนสถานะ</div>
         <div id="statusSection"><div class="spin-wrap"><div class="spinner"></div></div></div>`;
      const docs = await fetchProjectDocs(projectID);
      renderDocsSection(docs, projectID);
      renderStatusSection(p, docs);
    }
  } catch { toast("เปลี่ยนสถานะไม่สำเร็จ"); }
}

/* ─── Overlay confirm ─── */
async function confirmOverlay() {
  // Appointment: validate before closing
  if (APPT_STATUSES.has(_pendingStatus)) {
    const rawDate = document.getElementById("ov-appt-date")?.value;
    if (!rawDate) { toast("กรุณาเลือกวันและเวลานัดหมาย"); return; }
    closeOverlay();
    const note = document.getElementById("ov-appt-note")?.value.trim() || "";
    await doChangeStatus(_pendingProjectID, _pendingStatus, "", "", new Date(rawDate).toISOString(), note);
    return;
  }

  // Reject: validate before closing
  if (_pendingStatus === "reject") {
    const reason = document.getElementById("ov-reason")?.value.trim() || "";
    if (!reason) { toast("กรุณาระบุเหตุผลที่ปฏิเสธ"); return; }
    closeOverlay();
    await doChangeStatus(_pendingProjectID, "reject", "", reason);
    return;
  }

  // Open external browser for document upload (LINE Android blocks in-app file pickers)
  if (_pendingStatus === "__upload__") {
    const docType = document.getElementById("ov-doctype")?.value || "";
    if (!docType) { toast("กรุณาเลือกประเภทเอกสาร"); return; }
    closeOverlay();

    const uploadURL = API + "/liff/upload.html" +
      "?project_id=" + encodeURIComponent(_pendingProjectID) +
      "&token="      + encodeURIComponent(token) +
      "&doc_type="   + encodeURIComponent(docType);
    liff.openWindow({ url: uploadURL, external: true });
    return;
  }
}

/* ─── Helpers ─── */
function emptyH(icon, text, style) {
  return `<div class="empty"${style ? ` style="${style}"` : ""}><div class="empty-icon">${icon}</div><div class="empty-text">${text}</div></div>`;
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 2600);
}

function fmtDate(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });
}

function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fileIcon(filename) {
  const ext = (filename || "").split(".").pop().toLowerCase();
  if (ext === "pdf")               return "📄";
  if (["doc","docx"].includes(ext)) return "📝";
  if (["xls","xlsx"].includes(ext)) return "📊";
  return "📎";
}

function fmtSize(bytes) {
  if (!bytes) return "";
  if (bytes < 1024)        return bytes + " B";
  if (bytes < 1048576)     return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

function showProvinces() {
  filterProvinces();
}

function filterProvinces() {
  const inp  = document.getElementById("f-region");
  const q    = inp.value.trim();
  const drop = document.getElementById("province-drop");

  const matches = q ? PROVINCES.filter(p => p.includes(q)) : PROVINCES;

  if (!matches.length) {
    drop.innerHTML = '<div class="pdrop-empty">ไม่พบจังหวัด</div>';
  } else {
    const safe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    drop.innerHTML = matches.map(p => {
      const hl = q
        ? p.replace(new RegExp(safe, "g"), m => `<mark>${m}</mark>`)
        : p;
      return `<div class="pdrop-item" data-name="${p}" onclick="selectProvince(this.dataset.name)">${hl}</div>`;
    }).join("");
  }

  positionProvinceDrop();
  drop.classList.add("open");
}

function positionProvinceDrop() {
  const inp  = document.getElementById("f-region");
  const rect = inp.getBoundingClientRect();
  const drop = document.getElementById("province-drop");
  drop.style.top   = rect.bottom + "px";
  drop.style.left  = rect.left   + "px";
  drop.style.width = rect.width  + "px";
}

function selectProvince(name) {
  document.getElementById("f-region").value = name;
  document.getElementById("province-drop").classList.remove("open");
}

});

// When the user returns from the external upload page, refresh the
// document list so newly uploaded files appear immediately.
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !detailProjectID) return;
  fetchProjectDocs(detailProjectID).then(docs => {
    renderDocsSection(docs, detailProjectID);
    const p = projects.find(x => x.id === detailProjectID);
    if (p) renderStatusSection(p, docs);
  });
});

init();
</script>
